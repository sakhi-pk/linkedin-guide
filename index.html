<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Your Custom Roadmap | Tecno Zone Discovery</title>
<meta name="description" content="Get a custom roadmap for launching your app or growing your LinkedIn, sent straight to your inbox.">
<meta property="og:title" content="Get Your Custom Roadmap | Tecno Zone Discovery">
<meta property="og:description" content="Get a custom roadmap for launching your app or growing your LinkedIn, sent straight to your inbox.">
<meta property="og:type" content="website">
<style>
:root{--bg:#0b1f3a;--panel:#12294a;--text:#f3f6fb;--muted:#b7c3d6;--line:#2b4468;--accent:#ffc233;--on-accent:#1a1300;--err:#ff8a8a}
@media (prefers-color-scheme:light){:root{--bg:#f4f7fc;--panel:#fff;--text:#0b1f3a;--muted:#46587a;--line:#c9d4e6;--accent:#0b1f3a;--on-accent:#fff;--err:#b3261e}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px;background:var(--bg);color:var(--text);font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{width:100%;max-width:560px}
h1{font-size:clamp(1.9rem,6.5vw,2.7rem);line-height:1.12;margin:0 0 14px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px}
ul{list-style:none;padding:0;margin:0 0 26px}
li{padding-left:30px;position:relative;margin:8px 0}
li::before{content:"";position:absolute;left:4px;top:.45em;width:12px;height:7px;border-left:3px solid var(--accent);border-bottom:3px solid var(--accent);transform:rotate(-45deg)}
form{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
label{display:block;font-weight:600;font-size:.95rem;margin:0 0 6px}
.f{margin-bottom:16px}
input,select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:14px;min-height:52px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{width:100%;min-height:56px;font:inherit;font-weight:700;font-size:1.1rem;color:var(--on-accent);background:var(--accent);border:0;border-radius:12px;cursor:pointer}
button[disabled]{opacity:.7;cursor:wait}
.err{color:var(--err);font-size:.9rem;min-height:1.2em;margin:4px 0 0}
.trust{text-align:center;color:var(--muted);font-size:.9rem;margin:14px 0 0}
</style>
</head>
<body>
<main>
  <h1>Get Your Custom App Launch or LinkedIn Growth Roadmap</h1>
  <p class="sub">Tell us where you are and get a step-by-step plan in your inbox within minutes.</p>
  <ul>
    <li>A clear plan matched to your goal</li>
    <li>The exact next steps, in order</li>
    <li>A short video walkthrough to start today</li>
  </ul>
  <form id="f" novalidate>
    <div class="f">
      <label for="name">First name</label>
      <input id="name" name="name" type="text" autocomplete="given-name" required>
    </div>
    <div class="f">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
    </div>
    <div class="f">
      <label for="topic">What do you need help with?</label>
      <select id="topic" name="topic">
        <option value="app">App Idea to Launch</option>
        <option value="linkedin">LinkedIn Optimization</option>
      </select>
    </div>
    <p class="err" id="err" role="alert"></p>
    <button type="submit" id="btn">Send My Roadmap</button>
    <p class="trust">No spam. Unsubscribe anytime.</p>
  </form>
</main>
<script>
/* ===== CONFIG: edit here ===== */
const BRAND_NAME = "Tecno Zone Discovery";
const SUBSCRIBE_ENDPOINT = "/api/subscribe"; // Vercel serverless function (see api/subscribe.js)
const NEXT_PAGE = "discovery.html";
/* ============================= */

const f = document.getElementById("f"), btn = document.getElementById("btn"), err = document.getElementById("err");

function go(name, topic){
  location.href = NEXT_PAGE + "?name=" + encodeURIComponent(name) + "&topic=" + encodeURIComponent(topic);
}

f.addEventListener("submit", async function(e){
  e.preventDefault();
  const name = f.name.value.trim(), email = f.email.value.trim(), topic = f.topic.value;
  if(!name){ err.textContent = "Enter your first name."; f.name.focus(); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ err.textContent = "Enter a valid email address."; f.email.focus(); return; }
  err.textContent = "";
  btn.disabled = true; btn.textContent = "Sending...";
  const ctrl = new AbortController();
  const t = setTimeout(function(){ ctrl.abort(); }, 6000);
  try{
    await fetch(SUBSCRIBE_ENDPOINT, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({name: name, email: email, topic: topic}),
      signal: ctrl.signal
    });
  }catch(_){ /* never block the visitor */ }
  clearTimeout(t);
  go(name, topic);
});
</script>
</body>
</html>
